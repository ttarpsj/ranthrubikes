name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: mbstring, coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - run: python3 scripts/catalog_ingest.py validate
      - run: python3 scripts/sync_products.py --dry-run
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: chmod +x scripts/export-static.sh && scripts/export-static.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: static-export }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
